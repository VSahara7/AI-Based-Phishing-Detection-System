<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Analysis Report | CyberSafe Nepal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <nav>
        <div class="logo">
            🛡️ CyberSafe <span>Nepal</span>
        </div>
        <div class="nav-links">
            <a href="/">Home</a>
        </div>
    </nav>

    <div class="result-container">
        <h1>Safety Assessment Report</h1>

        <div class="result-card" style="border-color: {{color}};">
            
            <div class="result-header">
                <h2 style="color: {{color}};">
                    {{title}}
                </h2>
            </div>

            <div class="confidence">
                <div class="confidence-top">
                    <h3>AI Confidence Level</h3>
                    <span class="confidence-score">{{confidence}}%</span>
                </div>
                <div class="progress">
                    <div class="progress-bar" style="width: {{confidence}}%; background-color: {{color}};"></div>
                </div>
            </div>

            <div class="details">
                <div>
                    <strong>System Verdict</strong>
                    <p>{{prediction}}</p>
                </div>

                <div>
                    <strong>Risk Level</strong>
                    <p class="risk" style="color: {{color}};">{{risk}}</p>
                </div>
            </div>

            <div class="message-box">
                <h3>Analyzed Content</h3>
                <p>"{{message}}"</p>
            </div>

            <div class="advice">
                <h3>Recommended Action Steps</h3>
                <ul>
                    {% for item in advice %}
                    <li>{{item}}</li>
                    {% endfor %}
                </ul>
            </div>

            <a href="/" class="button">
                Check Another Message
            </a>

        </div>
    </div>

</body>
</html>
